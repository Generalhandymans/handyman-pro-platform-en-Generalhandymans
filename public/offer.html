<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpman — Job offer</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<style>
  .offer-wrap{max-width:620px;margin:0 auto;padding:2rem 1rem;}
  .offer-logo{display:block;margin:0 auto 1.5rem;max-width:280px;width:100%;height:auto;}
  .offer-terms{display:flex;gap:.6rem;align-items:flex-start;background:var(--amber-soft);border:1px solid var(--line);padding:.9rem 1rem;border-radius:var(--radius);margin:1.2rem 0;}
  .offer-meta{color:var(--muted);font-size:.9rem;}
  .offer-day{font-size:1.4rem;color:var(--navy);margin:.4rem 0;}
  #offer-msg{margin-top:1rem;font-weight:700;}
  #offer-msg.ok{color:var(--ok);} #offer-msg.err{color:var(--err);}
</style>
</head>
<body>
<main class="offer-wrap">
  <img class="offer-logo" src="img/logo-header.jpg" alt="Helpman — General Handyman Solutions">
  <div id="app"><div class="card"><p class="muted">Loading…</p></div></div>
</main>
<script src="js/api.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const offerToken = q.get('t'), schedToken = q.get('st');
  const pre = q.get('a'); // "1" accept preselected, "0" decline preselected
  const app = document.getElementById('app');
  const esc = HP.esc;

  function fail(msg) {
    app.innerHTML = `<div class="card"><p id="offer-msg" class="err">${esc(msg)}</p><p class="muted small">If you think this is a mistake, contact dispatch.</p></div>`;
  }

  async function load() {
    try {
      if (offerToken) {
        const s = await HP.api('GET', `/offers/${encodeURIComponent(offerToken)}`);
        renderOffer(s);
      } else if (schedToken) {
        const s = await HP.api('GET', `/schedule-confirm/${encodeURIComponent(schedToken)}`);
        renderSchedule(s);
      } else fail('This link is missing its token.');
    } catch (e) { fail(HP.friendlyMessage(e)); }
  }

  function renderOffer(s) {
    const first = esc((s.contractor_name || '').split(' ')[0]);
    app.innerHTML = `<div class="card">
      <h2 style="margin-top:0;color:var(--navy)">Job offer — ${esc(s.service_type)} <span class="muted">#${s.project_id}</span></h2>
      <p>Hi <strong>${first}</strong>, General Handyman Solutions is offering you this project:</p>
      <dl class="kv">
        <dt>Address</dt><dd>${esc(s.address || '—')}</dd>
        <dt>Details</dt><dd>${esc(s.description || '—')}</dd>
      </dl>
      <p class="offer-meta">This offer expires ${esc((s.expires_at || '').slice(0, 16).replace('T', ' '))}.</p>
      <label class="offer-terms"><input type="checkbox" id="terms" style="margin-top:.2rem">
        <span class="small">I accept the <a href="contractor-terms.html" target="_blank" rel="noopener">Independent Contractor Terms</a> for this job. Required to accept.</span></label>
      <div class="btn-row">
        <button class="btn btn-ok" id="b-ok" type="button">Accept job</button>
        <button class="btn btn-outline" id="b-no" type="button">Decline</button>
      </div>
      <p id="offer-msg" role="status"></p></div>`;
    if (pre === '0') document.getElementById('b-no').focus();
    document.getElementById('b-ok').onclick = () => respond('offers', offerToken, true);
    document.getElementById('b-no').onclick = () => respond('offers', offerToken, false);
  }

  function renderSchedule(s) {
    app.innerHTML = `<div class="card">
      <h2 style="margin-top:0;color:var(--navy)">Appointment confirmation <span class="muted">#${s.project_id}</span></h2>
      <p>Your appointment for <strong>${esc(s.service_type)}</strong> is set for:</p>
      <p class="offer-day"><strong>${esc(s.day)}</strong></p>
      ${s.arrival_window ? `<p class="offer-meta">Arrival window: <strong>${esc(s.arrival_window)}</strong></p>` : ''}
      <div class="banner" style="background:var(--info-bg);border:1px solid var(--line);">⏰ Arrival times are approximate — please keep the schedule a little flexible.</div>
      <div class="btn-row">
        <button class="btn btn-ok" id="b-ok" type="button">I confirm</button>
        <button class="btn btn-outline" id="b-no" type="button">I can&apos;t make it</button>
      </div>
      <p id="offer-msg" role="status"></p></div>`;
    if (pre === '0') document.getElementById('b-no').focus();
    document.getElementById('b-ok').onclick = () => respond('schedule-confirm', schedToken, true);
    document.getElementById('b-no').onclick = () => respond('schedule-confirm', schedToken, false);
  }

  async function respond(kind, token, accept) {
    const msg = document.getElementById('offer-msg');
    if (kind === 'offers' && accept && !document.getElementById('terms').checked) {
      msg.className = 'err'; msg.textContent = 'Please accept the Independent Contractor Terms first.';
      return;
    }
    const ok = document.getElementById('b-ok'), no = document.getElementById('b-no');
    HP.busy(ok, true, 'Sending…'); HP.busy(no, true, '');
    try {
      const r = await HP.api('POST', `/${kind}/${encodeURIComponent(token)}/respond`,
        accept ? { accept: true, terms_accepted: kind === 'offers' ? true : undefined } : { accept: false });
      msg.className = 'ok';
      msg.textContent = kind === 'offers'
        ? (r.accepted ? '✔ Offer accepted! The job is now waiting for the day to be confirmed — watch your email.' : 'Offer declined. Dispatch has been notified.')
        : (r.confirmed ? '✔ Schedule confirmed. See you then!' : 'Understood — dispatch has been notified to pick a new day.');
      ok.style.display = no.style.display = 'none';
      const t = document.getElementById('terms'); if (t) t.closest('.offer-terms').style.display = 'none';
    } catch (e) { msg.className = 'err'; msg.textContent = HP.friendlyMessage(e); HP.busy(ok, false); HP.busy(no, false); }
  }

  load();
})();
</script>
</body>
</html>
