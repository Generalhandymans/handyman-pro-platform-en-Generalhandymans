<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpman — Job offer</title>
<link rel="icon" href="favicon.svg">
<style>
  body{font-family:Arial,sans-serif;color:#15202b;max-width:560px;margin:0 auto;padding:24px;}
  .card{border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-top:12px;}
  .btn{display:inline-block;padding:12px 28px;border-radius:8px;font-weight:bold;text-decoration:none;cursor:pointer;border:0;font-size:16px;margin:6px 8px 6px 0;}
  .btn-ok{background:#16a34a;color:#fff;} .btn-no{background:#fff;color:#111827;border:2px solid #e2e8f0;}
  .btn:disabled{opacity:.5;cursor:wait;}
  .muted{color:#64748b;} .small{font-size:13px;}
  .terms{display:flex;gap:8px;align-items:flex-start;margin:14px 0;background:#f8fafc;padding:12px;border-radius:8px;}
  #msg{margin-top:12px;font-weight:bold;}
  .ok-msg{color:#16a34a;} .err-msg{color:#dc2626;}
</style>
</head>
<body>
<div style="text-align:center"><img src="img/logo-header.jpg" alt="Helpman" style="max-width:220px;height:auto;"></div>
<div id="app"><p class="muted">Loading…</p></div>
<script src="js/api.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const offerToken = q.get('t'), schedToken = q.get('st');
  const pre = q.get('a'); // "1" accept preselected, "0" decline preselected
  const app = document.getElementById('app');
  const esc = HP.esc;

  function fail(msg) { app.innerHTML = `<div class="card"><p class="err-msg" id="msg">${esc(msg)}</p><p class="muted small">If you think this is a mistake, contact dispatch.</p></div>`; }

  async function load() {
    try {
      if (offerToken) {
        const s = await HP.api('GET', `/offers/${encodeURIComponent(offerToken)}`);
        renderOffer(s);
      } else if (schedToken) {
        const s = await HP.api('GET', `/schedule-confirm/${encodeURIComponent(schedToken)}`);
        renderSchedule(s);
      } else fail('This link is missing its token.');
    } catch (e) { fail(HP.friendlyMessage(e)); }
  }

  function renderOffer(s) {
    app.innerHTML = `<div class="card">
      <h2>Job offer — ${esc(s.service_type)} (#${s.project_id})</h2>
      <p><strong>Hi ${esc(s.contractor_name.split(' ')[0])}</strong>, General Handyman Solutions is offering you this project:</p>
      <p><strong>Address:</strong> ${esc(s.address || '—')}<br>
      <strong>Details:</strong> ${esc(s.description || '—')}</p>
      <p class="muted small">This offer expires ${esc((s.expires_at || '').slice(0, 16).replace('T', ' '))}.</p>
      <label class="terms"><input type="checkbox" id="terms"> <span class="small">I accept the <a href="contractor-terms.html" target="_blank" rel="noopener">Independent Contractor Terms</a> for this job. Required to accept.</span></label>
      <button class="btn btn-ok" id="b-ok">Accept job</button>
      <button class="btn btn-no" id="b-no">Decline</button>
      <p id="msg"></p></div>`;
      if (pre === '0') document.getElementById('b-no').focus();
      document.getElementById('b-ok').onclick = () => respond('offers', offerToken, true);
      document.getElementById('b-no').onclick = () => respond('offers', offerToken, false);
  }

  function renderSchedule(s) {
    app.innerHTML = `<div class="card">
      <h2>Appointment confirmation (#${s.project_id})</h2>
      <p>Your appointment for <strong>${esc(s.service_type)}</strong> is set for:</p>
      <p style="font-size:20px;"><strong>${esc(s.day)}</strong>${s.arrival_window ? `<br><span class="muted">Arrival window: ${esc(s.arrival_window)}</span>` : ''}</p>
      <p class="muted small">Arrival times are approximate — please keep the schedule a little flexible.</p>
      <button class="btn btn-ok" id="b-ok">I confirm</button>
      <button class="btn btn-no" id="b-no">I can't make it</button>
      <p id="msg"></p></div>`;
      if (pre === '0') document.getElementById('b-no').focus();
      document.getElementById('b-ok').onclick = () => respond('schedule-confirm', schedToken, true);
      document.getElementById('b-no').onclick = () => respond('schedule-confirm', schedToken, false);
  }

  async function respond(kind, token, accept) {
    const msg = document.getElementById('msg');
    if (kind === 'offers' && accept && !document.getElementById('terms').checked) {
      msg.className = 'err-msg'; msg.textContent = 'Please accept the Independent Contractor Terms first.';
      return;
    }
    const ok = document.getElementById('b-ok'), no = document.getElementById('b-no');
    ok.disabled = no.disabled = true;
    try {
      const r = await HP.api('POST', `/${kind}/${encodeURIComponent(token)}/respond`,
        accept ? { accept: true, terms_accepted: kind === 'offers' ? true : undefined } : { accept: false });
      msg.className = 'ok-msg';
      msg.textContent = kind === 'offers'
        ? (r.accepted ? 'Offer accepted! The job is now waiting for the day to be confirmed — watch your email.' : 'Offer declined. Dispatch has been notified.')
        : (r.confirmed ? 'Schedule confirmed. See you then!' : 'Understood — dispatch has been notified to pick a new day.');
      ok.style.display = no.style.display = 'none';
      const t = document.getElementById('terms'); if (t) t.closest('.terms').style.display = 'none';
    } catch (e) { msg.className = 'err-msg'; msg.textContent = HP.friendlyMessage(e); ok.disabled = no.disabled = false; }
  }

  load();
})();
</script>
</body>
</html>
