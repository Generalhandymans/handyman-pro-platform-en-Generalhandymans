# General Handyman Solutions — Render blueprint (one-click deploy)
# https://render.com — connect the Generalhandymans/general-handyman-solutions-platform repo,
# create a new Blueprint, and Render provisions everything below.
services:
  - type: web
    name: general-handyman-solutions
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # SQLite needs a persistent disk or the database resets on every deploy.
    disk:
      name: handyman-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/handyman.db
      - key: HANDYMAN_FROM_EMAIL
        value: generalhandymans@gmail.com
      - key: HANDYMAN_FROM_NAME
        value: General Handyman Solutions
      - key: EMAIL_PROVIDER
        value: console
      # First admin (set these BEFORE first deploy — no demo accounts are created):
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Stripe — set after creating your Stripe account (see src/services/stripe.js):
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: STRIPE_PUBLISHABLE_KEY
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false
      # Optional — set in the Render dashboard after deploy:
      # - key: OPENAI_API_KEY
      # - key: SENDGRID_API_KEY
      #   (then switch EMAIL_PROVIDER to sendgrid)
    healthCheckPath: /api/health
